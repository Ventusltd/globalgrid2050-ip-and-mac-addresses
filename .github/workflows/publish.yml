name: Validate and publish identity registry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: npm ci --ignore-scripts
      - name: Test identity laws and scanning
        run: |
          python -m unittest discover -s tests -v
          python registry.py validate
          npm test
      - name: Preserve published history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [[ -n "$BASE_SHA" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid baseline SHA"; exit 1; }
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            if git cat-file -e "$BASE_SHA:data/registry.json" 2>/dev/null; then
              git show "$BASE_SHA:data/registry.json" > previous-registry.json
              python registry.py validate --previous previous-registry.json
            else
              echo "Verified baseline predates the registry."
            fi
          else
            echo "Initial root commit; no previous history exists."
          fi
      - run: python build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
